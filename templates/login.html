<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Scanner — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f9fa;
  --bg-card: #ffffff;
  --border: #e4e4e7;
  --accent: #e31e24;
  --accent-hover: #b81418;
  --accent-light: rgba(227, 30, 36, 0.04);
  --accent-light-border: rgba(227, 30, 36, 0.15);
  --t1: #18181b;
  --t2: #52525b;
  --t3: #71717a;
  --t4: #a1a1aa;
  --sans: 'Outfit', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --shadow-lg: 0 10px 30px -10px rgba(0, 0, 0, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--t1);
  font-family: var(--sans);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.bg-wireframe {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  opacity: 0.8;
}

.login-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  padding: 24px;
}

.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 40px 36px;
  box-shadow: var(--shadow-lg);
}

.logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-bottom: 8px;
}

.logo-text {
  font-family: var(--sans);
  font-weight: 800;
  font-size: 28px;
  color: var(--accent);
  letter-spacing: -0.03em;
}

.logo-triangle { fill: var(--accent); margin-bottom: -3px; }

.logo-sub {
  font-family: var(--sans);
  font-weight: 300;
  font-size: 20px;
  color: var(--t1);
  margin-left: 6px;
  border-left: 1px solid var(--border);
  padding-left: 10px;
}

.login-subtitle {
  text-align: center;
  font-size: 12px;
  color: var(--t3);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 32px;
}

.inp-group {
  margin-bottom: 20px;
}

.label {
  font-size: 10px;
  font-weight: 700;
  color: var(--t2);
  display: block;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.input-wrap {
  position: relative;
}

.input-wrap span.material-symbols-outlined {
  position: absolute;
  left: 14px;
  top: 12px;
  font-size: 18px;
  color: var(--t3);
  pointer-events: none;
}

.inp {
  width: 100%;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 11px 14px 11px 40px;
  color: var(--t1);
  font-family: var(--sans);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.inp:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(227, 30, 36, 0.08);
}

.inp::placeholder { color: var(--t4); }

.login-btn {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  border: none;
  border-radius: 4px;
  color: #ffffff;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(227, 30, 36, 0.15);
  margin-top: 8px;
}

.login-btn:hover {
  background: var(--accent-hover);
  box-shadow: 0 6px 16px rgba(227, 30, 36, 0.25);
}

.login-btn:active { transform: translateY(0.5px); }

.error-msg {
  background: rgba(227, 30, 36, 0.06);
  border: 1px solid rgba(227, 30, 36, 0.15);
  border-radius: 4px;
  padding: 10px 14px;
  color: var(--accent);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.error-msg span { font-size: 16px; }

.footer {
  text-align: center;
  margin-top: 24px;
  font-size: 10px;
  color: var(--t4);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.cred-hint {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--t3);
  line-height: 1.6;
}
</style>
</head>
<body>

<svg class="bg-wireframe" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="140" height="140" patternUnits="userSpaceOnUse">
      <path d="M 140 0 L 0 140 M 0 0 L 140 140" fill="none" stroke="rgba(227, 30, 36, 0.015)" stroke-width="1"/>
      <path d="M 140 0 L 140 140 M 0 140 L 140 140" fill="none" stroke="rgba(0, 0, 0, 0.01)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
</svg>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo-wrap">
      <span class="logo-text">Security</span>
      <svg width="10" height="12" viewBox="0 0 10 12" class="logo-triangle">
        <polygon points="0,12 10,6 0,0" />
      </svg>
      <span class="logo-sub">Recon</span>
    </div>
    <div class="login-subtitle">Attack Surface Intelligence</div>

    {% if error %}
    <div class="error-msg">
      <span class="material-symbols-outlined">error</span>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" id="login-form">
      <div class="inp-group">
        <span class="label">Username</span>
        <div class="input-wrap">
          <span class="material-symbols-outlined">person</span>
          <input class="inp" type="text" name="username" placeholder="admin" autocomplete="off" spellcheck="false" required>
        </div>
      </div>
      <div class="inp-group">
        <span class="label">Password</span>
        <div class="input-wrap">
          <span class="material-symbols-outlined">lock</span>
          <input class="inp" type="password" name="password" placeholder="••••••••" autocomplete="off" required>
        </div>
      </div>
      <button class="login-btn" type="submit">
        <span class="material-symbols-outlined" style="font-size:16px">login</span>
        SIGN IN
      </button>
    </form>

    <!-- Forced first-run password change (shown when login returns must_change) -->
    <form id="change-form" style="display:none">
      <div class="inp-group">
        <span class="label">Current (one-time) password</span>
        <div class="input-wrap">
          <span class="material-symbols-outlined">lock_clock</span>
          <input class="inp" type="password" name="current_password" autocomplete="off" required>
        </div>
      </div>
      <div class="inp-group">
        <span class="label">New password (min 12 chars)</span>
        <div class="input-wrap">
          <span class="material-symbols-outlined">lock_reset</span>
          <input class="inp" type="password" name="new_password" minlength="12" autocomplete="off" required>
        </div>
      </div>
      <button class="login-btn" type="submit">
        <span class="material-symbols-outlined" style="font-size:16px">key</span>
        SET NEW PASSWORD
      </button>
    </form>
  </div>
  <div class="footer">Authorized Penetration Testing Platform</div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = new URLSearchParams(new FormData(form));
  try {
    const resp = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: data.get('username'), password: data.get('password') })
    });
    const result = await resp.json();
    if (result.status === 'ok') {
      if (result.must_change) {
        showError('You must set a new password before continuing.');
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('change-form').style.display = '';
        document.querySelector('#change-form input[name=current_password]').value = data.get('password');
      } else {
        window.location.href = '/';
      }
    } else {
      showError(result.message || 'Invalid credentials');
    }
  } catch {
    form.submit();
  }
});

function showError(msg) {
  const errDiv = document.querySelector('.error-msg') || document.createElement('div');
  errDiv.className = 'error-msg';
  errDiv.innerHTML = '<span class="material-symbols-outlined">error</span> ' + msg;
  const card = document.querySelector('.error-msg') ? null : document.getElementById('login-form');
  if (card) card.parentNode.insertBefore(errDiv, card);
}

document.getElementById('change-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const body = {
    current_password: f.current_password.value,
    new_password: f.new_password.value,
  };
  try {
    const resp = await fetch('/api/auth/change_password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const result = await resp.json();
    if (result.status === 'ok') {
      window.location.href = '/';
    } else {
      showError(result.message || 'Could not change password');
    }
  } catch {
    showError('Network error while changing password');
  }
});
</script>
</body>
</html>
